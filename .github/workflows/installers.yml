name: Build native installers

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platforms to build
        type: choice
        options: [all, unix, macos, ubuntu]
        default: all
      draft_release:
        description: Create a draft release after every platform succeeds
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: installers-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    if: inputs.platform == 'all'
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --only-binary=:all: -r requirements-build.lock
      - run: python tools/fetch_native.py
      - run: python -m unittest discover -s tests -v
      - run: python tools/build.py
      - run: python tools/frozen_checks.py dist/0.3.1/DeskBridge/DeskBridge.exe
      - run: python tests/service_snapshot.py dist/0.3.1/DeskBridge
      - run: python tools/package.py
      - shell: pwsh
        run: |
          ./tools/bootstrap-inno.ps1
          python tools/installers.py --iscc "$PWD/build/tools/inno/ISCC.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed' }
      - run: python tools/checksums.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-x64
          if-no-files-found: error
          compression-level: 0
          path: |
            dist/DeskBridge-0.3.1-*.exe
            dist/DeskBridge-0.3.1-*.zip
            dist/SHA256SUMS-0.3.1-windows-x64.txt

  macos:
    if: inputs.platform != 'ubuntu'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    env:
      TMPDIR: ${{ github.workspace }}/build/tmp
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -c 'import tkinter; print(tkinter.TkVersion)'
      - run: mkdir -p build/tmp
      - name: Build pinned source dependencies for Intel macOS
        if: matrix.arch == 'x86_64'
        env:
          OPENSSL_STATIC: '1'
        run: |
          python -m pip install --only-binary=:all: -r requirements-macos-intel-build.lock
          export OPENSSL_DIR="$(brew --prefix openssl@3)"
          rustc --version
          python -m pip install --no-build-isolation --no-deps 'https://files.pythonhosted.org/packages/9d/af/182eb91b0df3fe75c4d9f26fe70684569566745f6ba7e5c9c73a862c5252/cryptography-50.0.2.tar.gz#sha256=7b46165bb56eb4704e2eaaf86f3c940d19154535d9b0ca7d6d590b04060e00d5'
          python -m pip install --no-build-isolation --no-deps 'https://files.pythonhosted.org/packages/93/20/69744d9de9d375dae2639dda9add7dae85d52d690b68c61b23b8a6468434/zeroconf-0.151.5.tar.gz#sha256=28c2ec9d772007eedf11b41a9c9fd3d5c684c17b00721ff8f1ee31b20ad286a1'
      - run: |
          python -m pip install --only-binary=:all: -r requirements-build.lock
      - run: python tools/fetch_native.py
      - run: python -m unittest discover -s tests -v
      - run: python tools/build.py
      - run: python tools/installers.py --native vendor/cache/deskflow-1.27.0-macos-${{ matrix.arch }}.dmg
      - run: python tools/frozen_checks.py dist/0.3.1/DeskBridge.app/Contents/MacOS/DeskBridge
      - run: python tools/macos_smoke.py
      - run: python tools/checksums.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-${{ matrix.arch }}
          if-no-files-found: error
          compression-level: 0
          path: |
            dist/DeskBridge-0.3.1-*.dmg
            dist/SHA256SUMS-0.3.1-macos-${{ matrix.arch }}.txt

  ubuntu:
    if: inputs.platform != 'macos'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv python3-tk xvfb xauth
          python3 -m venv .venv
          .venv/bin/python -m pip install --only-binary=:all: -r requirements-build.lock
      - run: .venv/bin/python tools/fetch_native.py
      - run: sudo apt-get install -y ./vendor/cache/deskflow-1.27.0-ubuntu-resolute-x86_64.deb
      - run: .venv/bin/python -m unittest discover -s tests -v
      - run: .venv/bin/python tools/build.py
      - run: .venv/bin/python tools/installers.py --native vendor/cache/deskflow-1.27.0-ubuntu-resolute-x86_64.deb
      - run: sudo apt-get install -y ./dist/DeskBridge-0.3.1-ubuntu-26.04-amd64.deb
      - run: .venv/bin/python tools/frozen_checks.py /opt/deskbridge/DeskBridge
      - run: xvfb-run -a .venv/bin/python tools/launch_smoke.py /opt/deskbridge/DeskBridge
      - run: .venv/bin/python tools/checksums.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ubuntu-26.04-amd64
          if-no-files-found: error
          compression-level: 0
          path: |
            dist/DeskBridge-0.3.1-*.deb
            dist/SHA256SUMS-0.3.1-ubuntu-26.04-amd64.txt

  draft-release:
    if: >-
      always() && !cancelled() && inputs.draft_release && github.ref == 'refs/heads/main' &&
      (needs.windows.result == 'success' || needs.windows.result == 'skipped') &&
      (needs.macos.result == 'success' || needs.macos.result == 'skipped') &&
      (needs.ubuntu.result == 'success' || needs.ubuntu.result == 'skipped')
    needs: [windows, macos, ubuntu]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: build/release
          merge-multiple: true
      - name: Draft release with installers and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view v0.3.1 --json isDraft --jq .isDraft > build/draft-state; then
            if ! grep -qx true build/draft-state; then
              echo 'Refusing to replace assets of a published release'
              exit 1
            fi
            gh release upload v0.3.1 build/release/* --clobber
            gh release edit v0.3.1 --notes-file docs/release-notes.md
          else
            gh release create v0.3.1 build/release/* --draft --target "$GITHUB_SHA" --title 'DeskBridge 0.3.1' --notes-file docs/release-notes.md
          fi
